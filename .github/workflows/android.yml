name: Android CI & GitHub Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-test-and-build:
    name: Unit Tests & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-mobile-agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  emulator-test:
    name: Android Emulator Instrumented Test
    runs-on: macos-13
    needs: unit-test-and-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Tests in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          force-avd-creation: false
          script: ./gradlew connectedCheck --stacktrace

  publish-github-release:
    name: Publish Release on GitHub
    runs-on: ubuntu-latest
    needs: [unit-test-and-build, emulator-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Final Release APK
        run: ./gradlew assembleDebug

      - name: Rename APK for Release
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/GeminiMobileAgent-v1.0.0.apk

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 release_assets/GeminiMobileAgent-v1.0.0.apk \
            --title "Gemini Mobile Agent v1.0.0" \
            --notes "### Gemini Mobile Agent v1.0.0
            - Native Android AI Agent powered by Google Gemini API.
            - Accessibility Service integration for autonomous phone control.
            - Real-time UI hierarchy parsing, indexed element actions, and coordinate gestures.
            - Draggable floating overlay controller with instant RED STOP emergency button.
            - Preloaded with Gemini 3.8 / Flash models." \
            --target "${{ github.sha }}"
