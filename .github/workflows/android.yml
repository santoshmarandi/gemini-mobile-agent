name: Android CI & GitHub Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-test-and-build:
    name: Unit Tests & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-mobile-agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  emulator-test:
    name: Android Emulator Instrumented Test
    runs-on: ubuntu-latest
    needs: unit-test-and-build
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Tests in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          force-avd-creation: false
          script: ./gradlew connectedCheck --stacktrace

  publish-github-release:
    name: Publish Release on GitHub
    runs-on: ubuntu-latest
    needs: [unit-test-and-build, emulator-test]
    if: ${{ always() && needs.unit-test-and-build.result == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Final Release APK
        run: ./gradlew assembleDebug

      - name: Rename APK for Release
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/GeminiMobileAgent-v1.0.1.apk

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### Gemini Mobile Agent v1.0.1
          - Ultra-fast API Key validation via Google Models API (instant response).
          - Added "Save Directly" button in settings so users are never blocked by network checks.
          - Default model set to `gemini-3.5-flash-lite` (sub-second latency ~0.5s).
          - Added OkHttp fast fallback (Happy Eyeballs RFC 8482) for mobile carrier connectivity.
          - Accessibility Service integration for autonomous phone control.
          - Draggable floating overlay controller with instant RED STOP emergency button.
          EOF
          gh release delete v1.0.1 --yes || true
          gh release create v1.0.1 release_assets/GeminiMobileAgent-v1.0.1.apk \
            --title "Gemini Mobile Agent v1.0.1" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}"
